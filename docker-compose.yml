# ASTRA — protótipo: PostgreSQL + API (FastAPI) que também serve as páginas Web.
#   docker compose up --build        → http://localhost:8000
#   docker compose --profile ia up   → inclui a IA de bordo (Ollama), opcional
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://astra:${POSTGRES_PASSWORD:-astra}@db:5432/astra
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      SPACE_WEATHER_REFRESH_MIN: ${SPACE_WEATHER_REFRESH_MIN:-30}
    ports:
      - "8000:8000"
    volumes:
      - cache:/data/cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ollama:            # IA de bordo (opcional). Depois: docker compose exec ollama ollama pull llama3.2:3b
    image: ollama/ollama:latest
    profiles: ["ia"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  cache:
  ollama:
